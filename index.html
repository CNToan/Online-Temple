<script type="module">
let initializeApp, getDatabase, ref, set, onValue, onDisconnect, remove; // nạp động trong initFirebase()

/*
=====================================================================
HỒ SƠ DỰ ÁN "CHÙA ONLINE" (mọi AI phải đọc hết khối này trước khi sửa)
=====================================================================
MỤC TIÊU: game đi chùa 3D chạy trên Chrome Android, nhiều người chơi thấy nhau
trong cùng một chùa. Chủ dự án KHÔNG biết lập trình: luôn giao file index.html
hoàn chỉnh + hướng dẫn từng bước bằng tiếng Việt đơn giản.
Dự án được nhiều AI làm luân phiên (AI 1 đến AI 6). File này là "bộ nhớ" chung.

QUY TẮC CHUNG CHO MỌI AI
1. Đọc hồ sơ này, rồi tóm tắt 3-5 dòng cho chủ dự án trước khi sửa.
2. Mỗi lần giao file: tăng BUILD_VERSION bên dưới và THÊM 1 mục vào NHẬT KÝ
   (mới nhất ở trên cùng). Không xóa hay sửa mục nhật ký của AI trước.
3. Mục nhật ký gồm: phiên bản, AI số mấy, đã đổi gì, vì sao, đụng vào khu nào
   của code, ĐÃ KIỂM THỬ gì / CHƯA kiểm thử gì (trung thực, không đoán).
4. Code mới phải có chú thích tiếng Việt giải thích "để làm gì / vì sao".
   Chia code theo các khu, mỗi khu có dòng tiêu đề dạng: ---------- TÊN KHU ----------
5. Không đổi HỢP ĐỒNG MẠNG (bên dưới). Nếu bắt buộc đổi: cập nhật mục đó, ghi
   vào nhật ký, và đưa chủ dự án luật Firebase mới kèm hướng dẫn dán từng bước.
6. Giữ nguyên khối FIREBASE_CONFIG. Không bao giờ để chữ DIEN_VAO.
7. Không tuyên bố "multiplayer đã chạy" nếu chưa được chủ dự án thử 2 máy thật.
8. Tên người chơi là dữ liệu không tin cậy: chỉ hiển thị bằng textContent/canvas,
   KHÔNG dùng innerHTML.
9. Cập nhật mục "VIỆC DỞ / LỖI ĐÃ BIẾT" khi phát hiện hoặc xử lý xong.
10. Khi chủ dự án bảo "viết bàn giao": ghi lại phiên bản hiện tại, việc đã làm,
    việc dở, lưu ý, và nhắc chủ dự án đính kèm đúng file index.html mới nhất.

11. TÊN FILE: mỗi lần giao file, đặt tên theo mẫu  onl temp - <việc đã sửa>.html  (ví dụ: onl temp - mắt.html,
    onl temp - mái chùa.html). Chủ dự án đã yêu cầu quy ước này. Nhiều việc thì nối bằng dấu phẩy. Khi đưa lên
    GitHub phải đổi tên lại thành index.html. Bản bàn giao đặt tên: onl temp - <việc> - bàn giao.txt

PHONG THỦY (quy ước chủ dự án, mọi AI phải giữ): ưu tiên SỐ LẺ. Hiện có: 9 bậc thang mỗi cổng,
3 cổng, cổng lớn rộng 3 ô, bậc trước rộng 5 ô, bậc bên rộng 3 ô. Cổng chính nằm đúng trục giữa
cổng - bàn thờ - tượng. "Phía trước" = hướng mặt tượng Phật quay ra (+z); tượng ở phía sau (-z).
Thêm vật thể (cây, đèn, cột, bậc...) thì ưu tiên số lượng lẻ.

KIẾN TRÚC
- ĐƠN VỊ ĐO CHUNG: "Ô CƠ SỞ" = một ô gạch sàn = 2 đơn vị trong code (ft.repeat = 15).
  Chủ dự án sẽ nói kích thước theo ô cơ sở (ví dụ "cây cao 3,5 ô" = 7 đơn vị).
  AI phải tự đổi: đơn vị code = ô cơ sở x 2. Nếu đổi kích thước ô gạch sàn thì phải
  hỏi chủ dự án và cập nhật dòng này. Kích thước hiện tại: phòng 15x15 ô; tường và cột
  cao 3,5 ô; đài cao 0,25 ô, sâu 3,25 ô; nhân vật cao khoảng 0,7 ô; tượng khối vàng cao
  khoảng 2,2 ô; tốc độ đi 2 ô/giây.
- Một file index.html. Three.js r128 (cdnjs, KHÔNG có CapsuleGeometry).
  Firebase Realtime Database SDK 10.12.2 (gstatic, module). Host: GitHub Pages.
- Các khu trong code: Three.js (cảnh, đèn, sàn, tường, cột, đài, bàn thờ, tượng),
  Địa hình và va chạm (groundY, collide), Nhân vật chibi (makeChar, POSE, animChar),
  Menu, Firebase (kết nối, register, sendNow, onPlayers, updList), Điều khiển
  (joystick, kéo xoay camera, nút hành động), Vòng lặp (loop).
- Tượng Phật hiện là khối vàng tượng trưng (placeholder) trong nhóm biến "st".
  Chủ dự án sẽ thay bằng tranh thờ hoặc model .glb sau cùng.

HỢP ĐỒNG MẠNG (KHÔNG ĐỔI KHI CHƯA BÁO CHỦ DỰ ÁN)
- Phòng: rooms/chua1/players/{id}
- Trường mỗi người chơi: n (tên, tối đa 12 ký tự), c (chỉ số màu 0-5),
  h (kiểu tóc 0-2), x, y, z, r (hướng quay), a (trạng thái, tối đa 8 ký tự),
  t (thời điểm gửi). Mọi trường khác bị luật Firebase TỪ CHỐI.
- Trạng thái a: idle, clasp, kneel, bow. Đi bộ không gửi, máy nhận tự suy ra.
- Luật Firebase hiện tại (đã Publish, không hết hạn):
  rooms/$room/players: .read true; $pid: .write true; .validate yêu cầu có
  n,x,y,z,r,a; n là chuỗi <=12; a là chuỗi <=8; x,y,z,r,c,h,t là số;
  $other (trường lạ) bị cấm.

VIỆC DỞ / LỖI ĐÃ BIẾT
- (v1.0.9) Hòa thượng ~70 nghìn tam giác/người, ảnh màu bị vỡ thành hàng nghìn mảnh nhỏ nên không giảm mặt tự động được. Cách tốt nhất: tạo lại model trên
  hyper3d từ ảnh MỘT góc nhìn chính diện với số mặt thấp. Model chưa có xương: chưa có chắp tay thật, bước chân. Menu tạm bỏ chọn màu/tóc/phụ kiện (code ACCS, makeMala còn đó nhưng không dùng).
- Tượng Phật còn là khối vàng placeholder (làm sau cùng).
- Phụ kiện (v1.0.8) mới chỉ hiển thị ở máy người đeo. Để đồng bộ online cần thêm trường m vào payload() và vào luật Firebase (báo chủ dự án trước).
- Ngoại thất chính điện còn là hộp phẳng: chưa có mái ngói, cánh cửa, hoành phi có chữ, sân chưa trang trí.
- Đồ họa nhân vật và chùa còn thô, cần thiết kế lại. Mặt đã làm xong (v1.0.7). Thân/áo/tóc/tay chân còn thô. Chủ dự án
  CẤM dùng khối hình học (trụ, cầu, nón) ghép lộ liễu làm nhân vật hay vật thể; đã bác 2 thử nghiệm (áo nón + tóc mũ;
  nặn liền khối SDF ra hình "chim cánh cụt"). Hãy xin ảnh tham khảo và làm từng bộ phận nhỏ cho chủ dự án duyệt.
- Lỗi nhỏ chưa sửa: dòng me.g.rotation.y = Math.PI trong startGame nằm trong chú thích nên không chạy.
- CHẾ ĐỘ LÀM VIỆC: chủ dự án sửa OFFLINE đến khi ưng ý mới cập nhật Firebase và GitHub một lần. Bản này KHÔNG đổi mạng.
- Luật Firebase chưa có đăng nhập, người cố tình phá vẫn có thể ghi rác hợp lệ.
- Chưa đo hiệu năng trên nhiều máy Android.

NHẬT KÝ THAY ĐỔI (mới nhất ở trên)
- v1.0.9 | AI 7 | THAY NHÂN VẬT bằng HÒA THƯỢNG (model GLB do chủ dự án tạo từ ảnh 2D trên hyper3d; chỉ giữ 1 hòa thượng chính diện, hai bản
  nhìn nghiêng/sau trong file gốc đã bị loại hẳn). Model nằm trong file riêng hoa_thuong.js (GLB mã hóa base64, ~4 MB, đặt cạnh index.html) để
  hồ sơ này không phình to; hoa_thuong.glb là cùng dữ liệu dạng GLB chuẩn. Khu mới "HÒA THƯỢNG" (MONK, loadMonk, makeMonk) trước makeChar; trình đọc GLB
  tự viết (không cần GLTFLoader vì r128 trên cdnjs không có). Model liền khối KHÔNG có xương => cắt đôi ở độ cao MONK.PIV (eo): LẠY/QUỲ ép thấp nửa dưới và cúi nửa trên;
  đi bộ lắc nhẹ; CHẮP TAY và THẢ LỎNG chưa khác nhau. MENU: bỏ hàng Màu áo, Kiểu tóc, Phụ kiện (tạm thời, theo yêu cầu chủ dự án); giữ ô tên, PLAY và nút
  CHƠI THỬ (chỉ để chủ dự án thử nghiệm, 1 máy, không online). Mạng KHÔNG đổi: vẫn gửi c=0, h=0; máy nhận bỏ qua c/h và vẽ hòa thượng.
  Nếu hoa_thuong.js thiếu/lỗi: hiện cảnh báo đỏ và tự dùng nhân vật cũ (khối hình). Khu đụng vào: menu (HTML+JS), makeChar, animChar, onPlayers, startGame.
  Đã kiểm thử: cú pháp JS; chạy thử bộ đọc GLB và cắt đôi với dữ liệu thật trong Node (số đỉnh/tam giác). CHƯA kiểm thử: hình dáng thật trong game trên điện thoại,
  độ khớp ở eo khi lạy, FPS (mỗi hòa thượng ~70 nghìn tam giác vẽ ra, gồm dải chồng ở eo, nặng hơn nhân vật cũ nhiều; nhiều người cùng lúc có thể giật), ảnh màu có bị lốm đốm khi nhìn xa không.
- v1.0.8 | AI 3 | Thêm PHỤ KIỆN CÓ THỂ CHỌN ở menu (hàng "Phụ kiện": Không / Tràng hạt). Phụ kiện đầu tiên: TRÀNG HẠT GỖ nâu đậm
  vân nâu nhạt (27 hạt, số lẻ theo phong thủy; hạt chủ + tua nhỏ ở giữa ngực), đeo quanh cổ rủ xuống ngực. Gắn vào nhóm "up" nên
  khi LẠY/CÚI tràng hạt cúi theo. Vân gỗ vẽ bằng canvas (hàm woodTex), hình học và vị trí hạt tính MỘT LẦN rồi dùng chung
  (malaParts), mỗi nhân vật chỉ tốn 1 InstancedMesh cho cả chuỗi hạt để nhẹ máy. Các hạt cách đều theo chiều dài cung và luôn
  chừa khoảng hở GAP nên không đụng nhau. makeChar có thêm tham số thứ 4 "acc" (0 = không, 1 = tràng hạt). Khu đụng vào: menu
  (HTML + JS), makeChar, startGame, khu mới "PHỤ KIỆN".
  KHÔNG đổi mạng, KHÔNG đổi luật Firebase => HIỆN CHỈ MÁY CỦA MÌNH THẤY tràng hạt của mình; người khác thấy mình chưa đeo.
  Muốn người khác thấy: thêm trường m (số 0-1) vào payload + luật Firebase (cần chủ dự án duyệt, xem mục VIỆC DỞ).
  Đã kiểm thử: cú pháp JS; tính toán khoảng hở giữa các hạt (nhỏ nhất > 0). CHƯA kiểm thử: hình dáng thật trên điện thoại (vị trí
  tràng hạt so với tay/áo ở tư thế CHẮP TAY và LẠY), FPS khi đông người, menu có đủ chỗ trên màn hình ngang nhỏ.
- v1.0.7 | AI 2 | Thay hai chấm mắt và hai quả cầu má hồng bằng KHUÔN MẶT VẼ CANVAS (mắt có lòng trắng, mống mắt chuyển
  sắc, đồng tử, điểm sáng, mi, lông mày, mũi, miệng, má hồng), dán lên đầu bằng UV chiếu thẳng (hàm drawFace, headGeo, HEADM).
  Có sẵn 4 biểu cảm nhưng game dùng ex=0. Tóc "Ngắn": độ phủ .62 -> .56 để không che mắt. Thêm quy tắc 11 đặt tên file.
  KHÔNG đổi mạng, KHÔNG đổi luật Firebase. (Số v1.0.7 này thay cho bản v1.0.7 thử nghiệm đã bị bỏ.)
  Đã kiểm thử: cú pháp JS, kiểm tra tọa độ UV của mắt bằng tính toán. CHƯA kiểm thử: hình dáng thật trên điện thoại, FPS khi có nhiều người,
  hai máy thấy nhau.
- v1.0.6 | AI 1 | Thêm KHÔNG GIAN ĐÌNH VIỆN: chính điện nay nằm trên nền cao 1,35 ô (nhóm "temple" nâng
  lên H); 3 cổng (trước lớn 3x2,5 ô; trái/phải nhỏ hơn 0,5 ô: 2,5x2 ô); mỗi cổng 9 bậc thang (trước
  rộng 5 ô, hai bên rộng 3 ô); sân đá trống bao quanh, tường rào thấp; người chơi xuất hiện ở sân
  trước. Viết lại groundY/collide thành groundY + blocked + collide(p,pv) cho cả sân, bậc, cổng.
  Giả định cần chủ dự án xác nhận: "nhỏ hơn 0.5 đơn vị" hiểu là 0.5 ô cơ sở, áp dụng cho cả rộng
  lẫn cao. Chưa có mái ngoài, cánh cửa, hoa văn. Không đổi mạng (y vẫn gửi như cũ).
  Đã kiểm thử: cú pháp JS. Chưa kiểm thử leo bậc/va chạm trên máy thật.
- v1.0.5 | AI 1 | Chốt đơn vị "ô cơ sở" (1 ô = 2 đơn vị code) làm chuẩn đo chung, ghi vào mục
  KIẾN TRÚC. Không đổi gameplay hay hình ảnh.
- v1.0.4 | AI 1 | Ô gạch sàn chỉnh thành đúng 2 đơn vị (ft.repeat = 15), thay cho 2.1 của
  v1.0.3. Sàn 30 chia đúng 15 ô nên khít tường, không còn ô bị cắt. Chưa xem trên máy thật.
- v1.0.3 | AI 1 | Ô gạch sàn nhỏ hơn 30% (cạnh ô từ 3 xuống 2.1 đơn vị) bằng cách đổi
  ft.repeat từ 10 thành 30/2.1 trong khu Sàn. Chỉ đổi hiển thị, không đụng mạng.
  Đã kiểm thử: chưa xem trên máy thật.
- v1.0.2 | AI 1 | Thêm nút "XEM THỬ ĐỒ HỌA" (solo=true): vào chùa 1 máy, KHÔNG dùng
  Firebase, để chủ dự án xem và duyệt đồ họa. Firebase giờ nạp bằng import() động nên
  trang vẫn chạy khi không tải được Firebase. Chế độ này chỉ để xem đồ họa, KHÔNG phải
  multiplayer giả; không dùng nó để tuyên bố multiplayer chạy. Đường PLAY online giữ
  nguyên logic. Đã kiểm thử: cú pháp JS. Chưa thử lại 2 máy thật sau thay đổi này.

/* Địa hình & va chạm (toàn bộ thế giới: sân + 9 bậc + chính điện) */
const WX = 27, WZN = -27, WZP = 36;                 // biên sân (đơn vị code)
const STAIRS = [{dx:0,dz:1,hw:5},{dx:-1,dz:0,hw:3},{dx:1,dz:0,hw:3}]; // trước, trái, phải
const GF = FW/2-.3, GS = SW/2-.3;                   // nửa bề rộng lối đi qua cổng (chừa mép 0.3)
function stairInfo(s,x,z){ return {d:s.dx*x+s.dz*z-15.75, ac:s.dx ? z : x}; } // d = khoảng cách tính từ mép nền; ac = lệch khỏi trục giữa
function groundY(x,z){
  if(Math.abs(x)<15.75 && Math.abs(z)<15.75) return H + ((z<-7.6 && Math.abs(x)<3.5) ? Math.min(.5,.5*(-7.6-z)/1.1) : 0); // nền chính điện + dốc lên đài thờ
  for(const s of STAIRS){ const q = stairInfo(s,x,z);
    if(Math.abs(q.ac)<=s.hw && q.d>=0 && q.d<NSTEP*RUN) return (NSTEP-Math.floor(q.d/RUN))*RISE; } // độ cao theo từng bậc
  return 0;
}
function blocked(x,z){ // true = không được đứng ở đây
  if(x<-WX||x>WX||z<WZN||z>WZP) return true;
  for(const s of STAIRS){ const q = stairInfo(s,x,z); // lan can hai bên cầu thang: chỉ đi vào từ đầu bậc dưới
    if(q.d>=0 && q.d<NSTEP*RUN && Math.abs(Math.abs(q.ac)-s.hw)<.25) return true; }
  if(Math.abs(x)<15.75 && Math.abs(z)<15.75){
    if(Math.abs(x)<14.3 && Math.abs(z)<14.3){              // bên trong chính điện
      if(z<-8.4 && Math.abs(x)>=3.5) return true;           // đài cao chỉ lên bằng bậc giữa
      if(Math.hypot(x,z+12.8)<1.9) return true;             // tượng
      if(Math.abs(x)<1.9 && z>-10.8 && z<-9.2) return true; // bàn thờ
      return false;
    }
    if(z>14.3 && Math.abs(x)<GF) return false;              // lối qua cổng lớn
    if(Math.abs(x)>14.3 && Math.abs(z)<GS) return false;    // lối qua cổng nhỏ trái/phải
    return true;                                            // còn lại là tường
  }
  return false;
}
function collide(p,pv){ // pv = vị trí trước đó; trượt dọc vật cản
  if(!blocked(p.x,p.z)) return;
  if(!blocked(p.x,pv.z)) p.z = pv.z; else if(!blocked(pv.x,p.z)) p.x = pv.x; else { p.x = pv.x; p.z = pv.z; }
}

const act = s => { if(!me) return; if(s==="bow"){ setState(me,"bow"); clearTimeout(bowTimer); bowTimer = setTimeout(() => { if(me.state==="bow") setState(me,"idle"); sendNow(true); }, 3000); }
  else if(me.state !== "bow"){ setState(me,s); } sendNow(true); };
$("bBow").onpointerdown = () => act("bow"); $("bKneel").onpointerdown = () => act("kneel");
$("bClasp").onpointerdown = () => act("clasp"); $("bIdle").onpointerdown = () => act("idle");

function startGame(isSolo){
  if(MONK.loading){ status("Đang tải nhân vật hòa thượng, đợi giây lát rồi bấm lại…"); return; }
  if(!isSolo && !connected) return;
  solo = isSolo;
  myName = $("nm").value.trim() || ("Khách"+Math.floor(Math.random()*900+100));
  me = makeChar(COLS[selCol], selHair, myName, selAcc);
  me.g.position.set((Math.random()-.5)*6, 0, 30); camPos.set(me.g.position.x, 3.2, 35.2); // xuất hiện ở sân trước, phải leo 9 bậc để vào chùa me.g.rotation.y = Math.PI; me.vy = 0;
  if(!isSolo) meRef = ref(db, `rooms/${ROOM}/players/${myId}`);
  joined = true; $("menu").style.display = "none"; $("hud").style.display = "block"; $("play").disabled = true;
  if(isSolo) status("🟡 XEM THỬ ĐỒ HỌA: chỉ mình bạn, không online"); else register();
}
$("play").onclick = () => startGame(false);
$("solo").onclick = () => startGame(true);

/* ---------- Vòng lặp ---------- */
let last = performance.now(), spd = 4;
const camPos = new THREE.Vector3(0,5,14);
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(.05,(now-last)/1000); last = now;
  if(joined){
    let ix = jx, iy = jy;
    if(keys.KeyA||keys.ArrowLeft) ix -= 1; if(keys.KeyD||keys.ArrowRight) ix += 1;
    if(keys.KeyW||keys.ArrowUp) iy -= 1; if(keys.KeyS||keys.ArrowDown) iy += 1;
    const mag = Math.min(1,Math.hypot(ix,iy)); let moving = mag > .15;
    if(moving && me.state === "bow") moving = false;
    if(moving){
      if(me.state === "kneel") setState(me,"idle");
      const f = -iy, rt = ix, s = Math.sin(camYaw), c = Math.cos(camYaw);
      const mx = -s*f + c*rt, mz = -c*f - s*rt, l = Math.hypot(mx,mz)||1;
      const p = me.g.position, pv = {x:p.x,z:p.z}; p.x += mx/l*spd*mag*dt; p.z += mz/l*spd*mag*dt; collide(p,pv);
      me.g.rotation.y = lerpAng(me.g.rotation.y, Math.atan2(mx,mz), 1-Math.exp(-14*dt));
    }
    me.g.position.y += (groundY(me.g.position.x, me.g.position.z) - me.g.position.y)*(1-Math.exp(-20*dt)); // mượt khi lên/xuống bậc
    animChar(me, dt, moving);
    const p = me.g.position, d = 5.2;
    const tgt = new THREE.Vector3(p.x+Math.sin(camYaw)*d, p.y+3.2, p.z+Math.cos(camYaw)*d);
    camPos.lerp(tgt, 1-Math.exp(-8*dt)); camera.position.copy(camPos);
    camera.lookAt(p.x, p.y+.9, p.z);
  } else {
    const t = now/1000*.15; camera.position.set(Math.sin(t)*9, 4.5, 31+Math.cos(t)*2); camera.lookAt(0,4,12); // nền menu: nhìn từ sân vào cổng chùa
  }
  for(const r of remotes.values()){
    const g = r.g, k = 1-Math.exp(-10*dt), px = g.position.x, pz = g.position.z;
    g.position.x += (r.tx-g.position.x)*k; g.position.y += (r.ty-g.position.y)*k; g.position.z += (r.tz-g.position.z)*k;
    g.rotation.y = lerpAng(g.rotation.y, r.tr, k);
    g.visible = (now - r.seen) < 12000;
    animChar(r, dt, Math.hypot(g.position.x-px, g.position.z-pz)/Math.max(dt,.001) > .5);
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);
</script></body></html>
